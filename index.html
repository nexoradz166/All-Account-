<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساباتي</title>
<meta name="description" content="حساباتي على إنستغرام وتيك توك وسناب شات في مكان واحد.">
<meta name="theme-color" content="#070B13">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="حساباتي">
<meta property="og:description" content="تابعني على إنستغرام وتيك توك وسناب شات.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B13;
  --bg-2:#0D1424;
  --line:#1C2B47;
  --line-hi:#3C6FD1;
  --blue:#5AA9FF;
  --blue-deep:#2F6BFF;
  --text:#E8F0FF;
  --muted:#8798B6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
body{
  margin:0;min-height:100%;
  background:var(--bg);
  background-image:radial-gradient(70% 45% at 50% 0%,rgba(47,107,255,.22),transparent 70%);
  background-repeat:no-repeat;
  color:var(--text);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
main{
  width:100%;max-width:440px;margin:0 auto;
  padding:56px 20px 40px;
  display:flex;flex-direction:column;align-items:center;
}
.avatar{
  width:136px;height:136px;border-radius:50%;padding:3px;
  background:conic-gradient(from 200deg,#7CC0FF,#2F6BFF,#0B1220,#5AA9FF,#7CC0FF);
  box-shadow:0 0 64px rgba(70,140,255,.35);
}
.avatar img{
  display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:4px solid var(--bg);
}
h1{margin:22px 0 4px;font-size:1.75rem;font-weight:700;letter-spacing:0}
.bio{margin:0 0 32px;color:var(--muted);font-size:1rem;text-align:center}
.links{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:12px}
.link{
  display:flex;align-items:center;gap:14px;
  min-height:64px;padding:12px 18px;
  background:var(--bg-2);
  border:1px solid var(--line);
  border-radius:16px;
  color:var(--text);text-decoration:none;
  transition:border-color .2s,background .2s,transform .2s;
}
.link:hover{border-color:var(--line-hi);background:#101A30;transform:translateY(-2px)}
.link:active{transform:translateY(0)}
.link:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.icon{
  flex:none;width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;
  background:rgba(90,169,255,.1);color:var(--blue);
}
.icon svg{width:22px;height:22px}
.name{font-weight:500;font-size:1.05rem}
.handle{margin-inline-start:auto;color:var(--muted);font-size:.9rem;direction:ltr;unicode-bidi:isolate}
.mail{
  margin-top:20px;width:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:56px;padding:12px 18px;border-radius:16px;
  background:linear-gradient(135deg,var(--blue-deep),#4C8DFF);
  color:#fff;text-decoration:none;font-weight:700;font-size:1.02rem;
  transition:filter .2s,transform .2s;
}
.mail:hover{filter:brightness(1.1);transform:translateY(-2px)}
.mail:focus-visible{outline:2px solid #fff;outline-offset:3px}
.mail svg{width:20px;height:20px}
.mail-addr{margin:10px 0 0;color:var(--muted);font-size:.88rem;direction:ltr;unicode-bidi:isolate}
footer{margin-top:44px;color:#5B6C89;font-size:.82rem}
