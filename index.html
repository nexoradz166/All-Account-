*{-webkit-tap-highlight-color:transparent}.lang{-webkit-appearance:none;appearance:none;outline:none;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,background .2s,border-color .2s,color .2s}.lang:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}.lang:hover{border-color:var(--blue)}.lang:active{transform:scale(.94);background:var(--blue);color:#02101f}.lang:focus-visible{border-color:var(--ice)}
.hero{text-align:center;margin:18px 0 30px}
.avw{width:150px;height:150px;margin:0 auto;border-radius:50%;position:relative;box-shadow:0 0 50px rgba(58,160,255,.35)}
.avw img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);border-radius:50%;object-fit:cover}
.avw:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--blue),#0b2a52,var(--ice),#0b2a52,var(--blue))}
h1{margin:18px 0 4px;font-size:34px;font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,#fff,var(--ice) 50%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.bio{margin:0 auto;max-width:34ch;color:var(--mute);line-height:1.8;font-size:15px}
.card{display:block;text-decoration:none;color:inherit;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:16px;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 12px 40px -12px rgba(58,160,255,.55);outline:none}
.row{display:flex;align-items:center;gap:14px}
.ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#0d2c54,#06101f);border:1px solid var(--line)}
.ic svg{width:26px;height:26px;fill:var(--ice)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:17px}
.meta span{display:block;color:var(--mute);font-size:14px;direction:ltr;text-align:start}
.go{flex:none;padding:8px 16px;border-radius:99px;background:var(--blue);color:#02101f;font-weight:700;font-size:14px}
.emb{margin-top:14px;border-radius:16px;background:linear-gradient(120deg,rgba(58,160,255,.12),rgba(2,8,16,.6));border:1px solid var(--line);padding:14px;display:flex;align-items:center;gap:12px}
.pl{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(58,160,255,.2);display:grid;place-items:center}
.pl:after{content:"";border-inline-start:12px solid var(--ice);border-block:7px solid transparent;margin-inline-start:-3px;transform:scaleX(-1)}
[dir=ltr] .pl:after{transform:none}
.emb p{margin:0;font-size:13px;color:var(--mute);line-height:1.6}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:30px}
.s{opacity:0;animation:in .8s ease forwards;animation-delay:var(--d,0s)}@keyframes in{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.s{opacity:1}}
</style>
</head>

en:{bio:"All my accounts in one place Follow me and let's stay in touch",follow:"Follow",add:"Add",tt:"My clips and videos on TikTok",sn:"Add me on Snapchat and see my daily life",ig:"My photos and stories on Instagram",foot:"Thanks for visiting",btn:"عربي"}};
var cur="ar";
function setLang(l){cur=l;var d=document.documentElement;d.lang=l;d.dir=l==="ar"?"rtl":"ltr";
document.querySelectorAll("[data-i18n]").forEach(function(e){e.textContent=T[l][e.dataset.i18n]});
document.getElementById("lang").textContent=T[l].btn;
try{localStorage.setItem("lang",l)}catch(e){}}
document.getElementById("lang").onclick=function(){setLang(cur==="ar"?"en":"ar")};
try{var s=localStorage.getItem("lang");if(s==="en")setLang("en")}catch(e){}
</script>
</body>
</html>
